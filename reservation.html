<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a Book - Readisphere</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-book-open"></i> Readisphere
            </a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="index.html#about" class="nav-link">About</a></li>
                <li class="nav-item"><a href="index.html#services" class="nav-link">Services</a></li>
                <li class="nav-item"><a href="reservation.html" class="nav-link active reserve-btn">Reserve a Book</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <div class="form-page-container">
        <div class="form-wrapper">
            <h2>Book Reservation Form</h2>
            <p class="form-subtitle">Fill in the details below to reserve your book.</p>
            
            <div id="successMessage" class="hidden success-box">
                <h3><i class="fas fa-check-circle"></i> Reservation Successful!</h3>
                <p>Here is a summary of your data:</p>
                <ul id="summaryList"></ul>
                <button type="button" class="btn btn-primary" onclick="resetFormState()">Make Another Reservation</button>
            </div>

            <form id="reservationForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="John Doe" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required>
                    <small class="error-message"></small>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="password">Account Password</label>
                        <input type="password" id="password" name="password" minlength="8" placeholder="Min 8 chars" required>
                        <small class="error-message"></small>
                    </div>
                    <div class="col">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required>
                        <small class="error-message"></small>
                    </div>
                </div>

                <div class="form-group row">
                    <div class="col">
                        <label for="startDate">Reservation Start Date</label>
                        <input type="date" id="startDate" name="startDate" required>
                        <small class="error-message"></small>
                    </div>
                    <div class="col">
                        <label for="endDate">Reservation End Date</label>
                        <input type="date" id="endDate" name="endDate" required>
                        <small class="error-message"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="membership">Membership Tier</label>
                    <select id="membership" name="membership" required>
                        <option value="" disabled selected>Select an option</option>
                        <option value="basic">Basic (Free)</option>
                        <option value="premium">Premium ($10/mo)</option>
                        <option value="student">Student ($5/mo)</option>
                    </select>
                    <small class="error-message"></small>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms and Conditions</label>
                    <small class="error-message"></small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Reservation</button>
                    <button type="reset" class="btn btn-outline">Reset</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-bottom">
                <p>&copy; 2026 Readisphere Library System. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
